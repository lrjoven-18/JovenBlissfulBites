<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order - Joven Blissful Bites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="gallery.html">Gallery</a><a href="order.html" class="active">Order</a></nav>
  <section>
    <h2>Order a cake</h2>
    <form id="orderForm">
      <label>Your name
        <input type="text" id="name" required>
      </label>
      <label>Cake
        <select id="cake">
          <option>Two Tier Cake</option>
          <option>Three Tier Cake</option>
          <option>Regulare Cake</option>
          <option>Cupcakes (box of 12)</option>
        </select>
      </label>
      <label>Date needed
        <input type="date" id="date" required>
      </label>
      <label>Theme
        <input type="text" id="note" required>
      </label>
      <button class="btn" type="submit">Send order on Messenger</button>
      <p id="copied" class="copied" hidden>Messenger is opening. If your order message is not in the chat box, just paste it and tap send. It is already copied.</p>
    </form>
  </section>
  <footer>
    <p><a class="fb-link" href="#" target="https://www.facebook.com/profile.php?id=100083236957205&mibextid=ZbWKwL" rel="noopener">Find us on Facebook</a></p>
    <p id="year"></p>
  </footer>
  <script>
    // Runs before script.js and takes over the order form submit
    document.getElementById("orderForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      event.stopImmediatePropagation(); // stops the older handler in script.js

      const name = document.getElementById("name").value;
      const cake = document.getElementById("cake").value;
      const date = document.getElementById("date").value;
      const note = document.getElementById("note").value;

      let message = `Hi! I'd like to order a ${cake} for ${date}. My name is ${name}.`;
      if (note) {
        message = ` Theme: "${note}".`;
      }

      // Copy as a backup, in case Messenger doesn't fill in the text
      const box = document.getElementById("copied");
      try {
        await navigator.clipboard.writeText(message);
      } catch (e) {
        box.textContent = message; // show it so it can be copied by hand
      }
      box.hidden = false;

      // Open Messenger with the message already attached to the link
      const url = "https://m.me/109958375091707" + 109958375091707 + "?text=" + encodeURIComponent(message);
      window.open(url, "https://m.me/109958375091707");
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
