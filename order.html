<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order - Joven Blissful Bites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="gallery.html">Gallery</a><a href="order.html" class="active">Order</a></nav>
  <section>
    <h2>Order a cake</h2>
    <form id="orderForm">
      <label>Your name
        <input type="text" id="name" required>
      </label>
      <label>Cake
        <select id="cake">
          <option>Chocolate Cake</option>
          <option>Vanilla Birthday Cake</option>
          <option>Red Velvet</option>
          <option>Cupcakes (box of 6)</option>
        </select>
      </label>
      <label>Date needed
        <input type="date" id="date" required>
      </label>
      <label>Message on the cake (optional)
        <input type="text" id="note">
      </label>
      <button class="btn" type="submit">Send order on Messenger</button>
      <p id="copied" class="copied" hidden>Order message copied! Paste it in the Messenger chat and tap send.</p>
    </form>
  </section>
  <footer>
    <p><a class="fb-link" href="#" target="_blank" rel="noopener">Find us on Facebook</a></p>
    <p id="year"></p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
